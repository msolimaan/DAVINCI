name: Diagnose App Launch

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

jobs:
  launch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Launch, screenshot and sample
        run: |
          mkdir -p diag
          BIN="build/DaVinci Cleaner.app/Contents/MacOS/DaVinciCleaner"
          for v in nostart nobanner nomodule nohero nobutton nohero,nobutton,nobg; do
            DAVINCI_DEBUG=1 DAVINCI_VARIANT=$v "$BIN" > diag/stdout-$v.log 2>&1 &
            PID=$!
            sleep 9
            screencapture -x diag/screen-$v.png || true
            kill $PID || true
            sleep 2
          done
          ls diag

      - name: Print diagnostics
        if: always()
        run: |
          echo "===== ps"
          for f in diag/stdout-*.log; do echo "--- $f"; cat "$f"; done
          echo "===== system log"; grep -iE "fault|crash|assert|swiftui|AttributeGraph|cycle" diag/system.log | grep -v GetAPFSVolumeRole | head -60 || true
          echo "===== sample (main thread)"; sed -n '/Call graph:/,/Total number in stack/p' diag/sample.txt | head -150 || true
          for shot in diag/screen-*.png; do shot=$(basename $shot .png)
            sips -s format jpeg -s formatOptions 45 -Z 600 diag/$shot.png --out diag/$shot.jpg >/dev/null 2>&1 || true
            echo "===== BEGIN $shot"; base64 -i diag/$shot.jpg | tr -d '\n'; echo; echo "===== END $shot"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: diag
