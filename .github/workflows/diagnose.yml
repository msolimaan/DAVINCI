name: Diagnose App Launch

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]

jobs:
  launch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./scripts/build-app.sh

      - name: Launch, screenshot and sample
        run: |
          mkdir -p diag
          "build/DaVinci Cleaner.app/Contents/MacOS/DaVinciCleaner" > diag/stdout.log 2>&1 &
          PID=$!
          sleep 12
          screencapture -x diag/screen-12s.png || true
          sample $PID 5 -file diag/sample.txt || true
          sleep 5
          screencapture -x diag/screen-20s.png || true
          ps -o pid,pcpu,rss,state,command -p $PID > diag/ps.txt || true
          log show --last 2m --style compact --predicate "process == 'DaVinciCleaner'" > diag/system.log 2>&1 || true
          kill $PID || true

      - name: Print diagnostics
        if: always()
        run: |
          echo "===== ps"; cat diag/ps.txt || true
          echo "===== stdout"; cat diag/stdout.log || true
          echo "===== system log"; grep -iE "error|fault|crash|assert|hang" diag/system.log | head -80 || true
          echo "===== sample (main thread)"; sed -n '/Call graph:/,/Total number in stack/p' diag/sample.txt | head -150 || true
          for shot in screen-12s screen-20s; do
            sips -s format jpeg -s formatOptions 45 -Z 900 diag/$shot.png --out diag/$shot.jpg >/dev/null 2>&1 || true
            echo "===== BEGIN $shot"; base64 -i diag/$shot.jpg | tr -d '\n'; echo; echo "===== END $shot"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: diag
