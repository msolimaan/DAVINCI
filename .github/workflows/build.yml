name: Build Mac App

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Package DMG
        run: |
          ./scripts/make-dmg.sh
          (cd build && ditto -c -k --keepParent "DaVinci Cleaner.app" DaVinci-Cleaner.zip)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaVinci-Cleaner
          path: |
            build/DaVinci-Cleaner.dmg
            build/DaVinci-Cleaner.zip

      - name: Publish download on the Releases page
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: DaVinci Cleaner (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build of `${{ github.ref_name }}` at ${{ github.sha }}.

            **Install:** open `DaVinci-Cleaner.dmg` and drag **DaVinci Cleaner** into **Applications**.

            **First launch:** the app isn't notarized by Apple, so macOS will block it the first time.
            Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**
            (or run `xattr -dr com.apple.quarantine "/Applications/DaVinci Cleaner.app"` in Terminal).
          files: |
            build/DaVinci-Cleaner.dmg
            build/DaVinci-Cleaner.zip
