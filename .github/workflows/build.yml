name: Build Mac App

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build universal app
        run: UNIVERSAL=1 ./scripts/build-app.sh

      - name: Package DMG
        run: |
          ./scripts/make-dmg.sh
          (cd build && ditto -c -k --keepParent "DaVinci Cleaner.app" DaVinci-Cleaner.zip)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DaVinci-Cleaner
          path: |
            build/DaVinci-Cleaner.dmg
            build/DaVinci-Cleaner.zip

      - name: Publish download on the Releases page
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases in this repo are immutable, so every build gets its own tag.
          # `gh release create` uploads the files to a draft first, then publishes it.
          TAG="build-${{ github.run_number }}"
          cat > notes.md <<'NOTES'
          **Install:** open `DaVinci-Cleaner.dmg` and drag **DaVinci Cleaner** into **Applications**.

          **First launch:** the app isn't notarized by Apple, so macOS blocks it the first time.
          Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**,
          or run `xattr -dr com.apple.quarantine "/Applications/DaVinci Cleaner.app"` in Terminal.

          Then grant **Full Disk Access** in **System Settings → Privacy & Security → Full Disk Access**.
          NOTES
          gh release create "$TAG" build/DaVinci-Cleaner.dmg build/DaVinci-Cleaner.zip \
            --target "${{ github.sha }}" \
            --title "DaVinci Cleaner (build ${{ github.run_number }})" \
            --notes-file notes.md \
            --latest
